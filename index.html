<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serendib Multi Sport — IRONMAN 70.3 Colombo 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <img class="logo-dark" src="images/Serendib%20multisport%20logo%20-%20Final-05.png" alt="Serendib Multisport">
    <img class="logo-light" src="images/Serendib%20multisport%20logo%20-%20Final-02.png" alt="Serendib Multisport">
    <span>IRONMAN 70.3 Colombo 2027</span>
  </div>
  <div class="head-right">
    <a class="by" href="https://digimeads.com/" target="_blank" rel="noopener" aria-label="Presented by DigiMe Ads">
      <small>Presented by</small>
      <img class="logo-dark" src="images/digime-logo-white.png" alt="DigiMe Ads">
      <img class="logo-light" src="images/digime-logo-navy.png" alt="DigiMe Ads">
    </a>
    <span class="hint">← → to navigate</span><button class="theme" id="theme" aria-label="Toggle light or dark theme">Theme</button>
  </div>
</header>

<main class="stage" id="stage"></main>

<footer>
  <div class="course" aria-hidden="true">
    <div class="legs"><span class="s"></span><span class="b"></span><span class="r"></span></div>
    <div class="fill" id="fill"></div>
    <div class="labels"><span>Swim 1.9 km</span><span>Bike 90 km</span><span>Run 21.1 km · Finish</span></div>
  </div>
  <div class="nav">
    <button id="prev" aria-label="Previous slide">‹</button>
    <span class="count" aria-live="polite"><b id="cur">01</b> / <span id="tot">16</span></span>
    <button id="next" aria-label="Next slide">›</button>
  </div>
</footer>
</div>

<script src="js/app.js"></script>
</body>
</html>
